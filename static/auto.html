<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TePMA — Automated Interview</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .stage { text-align:center; padding:1.5rem 1rem; }
  #bigBtn {
    font-size:1.25rem; padding:1.1rem 2.4rem; border-radius:999px;
    box-shadow:0 6px 20px rgba(79,70,229,.35);
  }
  #bigBtn.active { background:#dc2626; box-shadow:0 6px 20px rgba(220,38,38,.35); }
  #stopListeningBtn { margin-top:.85rem; background:#dc2626; }
  .language-picker { display:flex; align-items:center; justify-content:center; gap:.6rem;
                     margin-bottom:1rem; font-size:.9rem; }
  .language-picker select { font:inherit; padding:.55rem .8rem; border-radius:9px;
                            border:1px solid color-mix(in srgb,currentColor 25%,transparent);
                            background:Canvas; color:CanvasText; }
  #phase { font-size:1.05rem; margin-top:1rem; min-height:1.5em; }
  #sub { font-size:.9rem; opacity:.6; min-height:1.2em; }
  .bigmeter { width:min(320px,80%); height:10px; border-radius:5px; margin:1rem auto 0;
              background:color-mix(in srgb, currentColor 15%, transparent); overflow:hidden; }
  .bigmeter > div { height:100%; width:0%; background:#22c55e; transition:width 80ms linear; }
  .steps { display:flex; justify-content:center; gap:.4rem; margin-top:1.2rem; flex-wrap:wrap; }
  .step { font-size:.78rem; padding:.28rem .7rem; border-radius:999px; opacity:.4;
          border:1px solid color-mix(in srgb, currentColor 30%, transparent); }
  .step.on { opacity:1; border-color:#4f46e5; background:color-mix(in srgb,#4f46e5 18%,transparent); }
  .step.done { opacity:.85; border-color:#22c55e; }
  .step.skipped { opacity:.85; border-color:#f59e0b; }
  .progress-track { height:12px; margin:1rem auto .35rem; overflow:hidden; border-radius:999px;
                    background:color-mix(in srgb,currentColor 15%,transparent); }
  .progress-fill { width:0; height:100%; border-radius:inherit;
                   background:linear-gradient(90deg,#4f46e5,#22c55e);
                   transition:width .35s ease; }
  #progressLabel { font-size:.82rem; opacity:.7; }
  dialog {
    border:none; border-radius:14px; padding:1.4rem; max-width:min(440px,90vw);
    background:Canvas; color:CanvasText;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog h3 { margin:0 0 .6rem; font-size:1.1rem; }
  dialog p { margin:0 0 1.1rem; line-height:1.5; }
  .dlg-actions { display:flex; gap:.6rem; justify-content:flex-end; }
  .ghost { background:transparent; border:1px solid color-mix(in srgb,currentColor 30%,transparent); color:inherit; }
</style>
</head>
<body>
  <h1>🎙️ TePMA — Automated Interview</h1>
  <nav><a href="/assistant">✨ Unified assistant</a> &nbsp;|&nbsp; <a href="/">Manual interview</a> &nbsp;|&nbsp; <a href="/docs-assistant">Documents</a></nav>

  <div class="card stage">
    <label class="language-picker" for="languageSelect">
      Interview language
      <select id="languageSelect">
        <option value="en">English</option>
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
      </select>
    </label>
    <button id="bigBtn">Start interview</button>
    <div id="phase">Click start. The interview runs on its own and prints your resume at the end.</div>
    <div id="sub"></div>
    <div class="bigmeter"><div id="meterFill"></div></div>
    <button id="stopListeningBtn" type="button" hidden>Stop listening &amp; send answer</button>
    <div class="steps">
      <span class="step" id="s-interview">Interview</span>
      <span class="step" id="s-profile">Build profile</span>
      <span class="step" id="s-pdf">Save PDF</span>
      <span class="step" id="s-print">Print</span>
    </div>
    <div id="progressTrack" class="progress-track" role="progressbar"
         aria-label="Automated interview progress" aria-valuemin="0" aria-valuemax="100"
         aria-valuenow="0"><div id="progressFill" class="progress-fill"></div></div>
    <div id="progressLabel">Ready — 0%</div>
  </div>

  <div class="card">
    <h2>Conversation</h2>
    <div id="chatLog"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2>Result</h2>
    <div class="row">
      <a id="pdfLink" target="_blank"><button>Open resume PDF</button></a>
      <a id="docxLink"><button class="ghost">Download Word</button></a>
      <button id="reprintBtn" class="ghost">Print again</button>
    </div>
    <div id="corrections" class="status" style="margin-top:.8rem"></div>
  </div>

  <dialog id="dlg">
    <h3 id="dlgTitle">Something went wrong</h3>
    <p id="dlgBody"></p>
    <div class="dlg-actions">
      <button id="dlgRetry" class="ghost" style="display:none">Retry</button>
      <button id="dlgOk">OK</button>
    </div>
  </dialog>

<script src="/static/voice.js"></script>
<script>
let sessionId = null, running = false, lastResult = null, retryAction = null;

// ---------- popup ----------
function popup(title, body, onRetry) {
  dlgTitle.textContent = title;
  dlgBody.textContent = body;
  retryAction = onRetry || null;
  dlgRetry.style.display = onRetry ? "" : "none";
  if (!dlg.open) dlg.showModal();
}
dlgOk.addEventListener("click", () => dlg.close());
dlgRetry.addEventListener("click", () => { dlg.close(); const a = retryAction; retryAction = null; a?.(); });

// ---------- ui helpers ----------
const steps = ["interview", "profile", "pdf", "print"];
function setStep(name, state) {
  const el = document.getElementById("s-" + name);
  el.classList.toggle("on", state === "on");
  el.classList.toggle("done", state === "done");
  el.classList.toggle("skipped", state === "skipped");
}
function resetSteps() { steps.forEach(s => { setStep(s, ""); }); }
function setProgress(percent, label) {
  const value = Math.max(0, Math.min(100, Math.round(percent)));
  progressFill.style.width = value + "%";
  progressTrack.setAttribute("aria-valuenow", value);
  progressLabel.textContent = `${label} — ${value}%`;
}
function setListeningButton(active, sending = false) {
  stopListeningBtn.hidden = !active;
  stopListeningBtn.disabled = sending;
  stopListeningBtn.textContent = sending
    ? "Sending answer…"
    : "Stop listening & send answer";
}
function say(phase, sub = "") { document.getElementById("phase").textContent = phase; document.getElementById("sub").textContent = sub; }
function addMsg(role, text, partial = false) {
  const d = document.createElement("div");
  d.className = `msg ${role}` + (partial ? " partial" : "");
  d.textContent = text;
  chatLog.appendChild(d);
  chatLog.scrollTop = chatLog.scrollHeight;
  return d;
}

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `Server error ${res.status}`);
  return data;
}

function downloadPdf(url) {
  const link = document.createElement("a");
  link.href = url;
  link.download = "TePMA-resume.pdf";
  document.body.appendChild(link);
  link.click();
  link.remove();
}

function presentResult(result) {
  lastResult = result;
  pdfLink.href = result.pdf_url;
  docxLink.href = result.docx_url;
  resultCard.style.display = "";
  corrections.textContent = (result.corrections || []).length
    ? "Auto-corrected: " + result.corrections.map(c => `${c.from} → ${c.to}`).join("; ")
    : "";
  setStep("print", result.printed ? "done" : "skipped");
  setProgress(100, result.printed ? "Resume saved and printed" : "Resume saved; printing skipped");
  refreshPrinterStatus();

  if (result.printed) {
    say(`Done — PDF saved and sent to ${result.printer_name}.`, "");
    return;
  }

  downloadPdf(result.pdf_url);
  if (result.print_status === "not_connected") {
    say("Done — PDF saved.", "Printer not connected, so printing was skipped. The PDF download has started.");
  } else {
    say("PDF saved, but printing failed.", "The PDF download has started.");
    popup("Printer problem", (result.print_error || "The printer could not accept the PDF.") +
          "\n\nYour resume was still saved and downloaded.", () => reprint());
  }
}

// ---------- the automated loop ----------
async function runAuto() {
  const selectedLanguage = languageSelect.value;
  running = true;
  sessionId = null;
  lastResult = null;
  chatLog.innerHTML = "";
  resultCard.style.display = "none";
  resetSteps();
  setProgress(0, "Ready");
  bigBtn.textContent = "Stop";
  bigBtn.classList.add("active");
  languageSelect.disabled = true;
  setStep("interview", "on");

  try {
    say("Starting…");
    setProgress(5, "Starting interview");
    const start = await api("/auto/start", { language: selectedLanguage });
    sessionId = start.session_id;
    setProgress(10, "Interview started");

    let reply = start.reply, done = false;
    while (running) {
      addMsg("assistant", reply);
      say("Interviewer speaking…");
      try { await speak("/auto/speak", reply, selectedLanguage); }
      catch { /* keep going silently: text is on screen */ }
      if (!running) break;
      if (done) break;

      // listen for the answer
      const partial = addMsg("user", "…", true);
      say("Listening…", "Pause for 3 seconds or press Stop listening & send answer.");
      let answer;
      try {
        answer = await listen({
          wsPath: "/auto/listen",
          onPartial: t => { partial.textContent = t || "…"; chatLog.scrollTop = chatLog.scrollHeight; },
          onStatus: t => {
            document.getElementById("sub").textContent = t;
            if (t.startsWith("Listening") || t.startsWith("Silence")) setListeningButton(true);
            if (t.startsWith("Finalizing")) setListeningButton(true, true);
          },
          meterEl: meterFill,
          language: selectedLanguage,
        });
      } catch (err) {
        partial.remove();
        throw new Error("Microphone or connection problem: " + err.message);
      } finally {
        setListeningButton(false);
      }
      partial.remove();
      if (!running) break;

      if (!answer) {                       // silence: re-ask once rather than dying
        addMsg("user", "(no speech detected)");
        reply = "Sorry, I did not catch that. Could you say it again?";
        continue;
      }
      addMsg("user", answer);

      say("Thinking…");
      const turn = await api("/auto/turn", { session_id: sessionId, answer });
      reply = turn.reply;
      done = turn.done;
      const covered = (turn.covered || []).length;
      setProgress(10 + (covered / 9) * 35, `Interview: ${covered} of 9 topics`);
    }

    if (!running) { say("Stopped."); return; }

    // ----- automatic finish -----
    setStep("interview", "done");
    setStep("profile", "on");
    setProgress(50, "Building profile");
    say("Building your profile…", "Reading the whole conversation. This takes a few seconds.");
    const profile = await api("/auto/profile", { session_id: sessionId });
    setStep("profile", "done");
    setStep("pdf", "on");
    setProgress(70, "Creating and saving PDF");
    say("Saving your resume…", "Creating PDF and Word files.");
    const documents = await api("/auto/build-resume", { session_id: sessionId });
    setStep("pdf", "done");
    setStep("print", "on");
    setProgress(90, "Checking printer");
    say("PDF saved.", "Checking whether a printer is connected…");
    const printing = await api("/auto/print", { session_id: sessionId });
    presentResult({ ...profile, ...documents, ...printing });
  } catch (err) {
    say("Interview stopped.", "");
    popup("Something went wrong", err.message, sessionId ? () => finishOnly() : null);
  } finally {
    running = false;
    bigBtn.textContent = "Start interview";
    bigBtn.classList.remove("active");
    languageSelect.disabled = false;
  }
}

// retry just the finish step (interview already captured)
async function finishOnly() {
  try {
    say("Retrying…");
    setProgress(50, "Rebuilding resume");
    const result = await api("/auto/finish", { session_id: sessionId });
    setStep("interview", "done");
    setStep("profile", "done");
    setStep("pdf", "done");
    presentResult(result);
  } catch (err) { popup("Still failing", err.message, null); }
}

async function reprint() {
  if (!lastResult) return;
  try {
    setStep("print", "on");
    setProgress(90, "Checking printer");
    const r = await api("/auto/print", { session_id: lastResult.session_id });
    lastResult = { ...lastResult, ...r };
    if (r.printed) presentResult(lastResult);
    else if (r.print_status === "not_connected") {
      setStep("print", "skipped");
      setProgress(100, "Resume saved; printer not connected");
      say("PDF remains saved.", "Printer: Not connected.");
      refreshPrinterStatus();
    } else popup("Printer problem", r.print_error, null);
  } catch (err) { popup("Could not print", err.message, null); }
}

bigBtn.addEventListener("click", () => {
  if (running) {
    running = false;
    activeSession()?.abort();
    say("Stopping…");
  } else {
    runAuto();
  }
});
stopListeningBtn.addEventListener("click", () => {
  const listening = activeSession();
  if (!listening) return;
  setListeningButton(true, true);
  listening.finish();
});
reprintBtn.addEventListener("click", reprint);
</script>
</body>
</html>
